<title>Elaina Visual Novel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

#menu {
    width: 100vw;
    height: 100vh;
    background: url('background start.jpg') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
}

.menu-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: white;
}

.menu-content h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

#playerName {
    width: 300px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    text-align: center;
}

#startBtn {
    margin-top: 15px;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

#game {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
    background: url('taman.jpg') center/cover no-repeat;
}

#character {
    position: absolute;
    left: 50px;
    bottom: 120px;
    height: 78%;
    max-height: 750px;
    opacity: 0;
    pointer-events: none;
}

#character img {
    display: block;
    height: 100%;
    max-width: 90vw;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
}

#character.appear {
    animation: elainaAppear 1.2s ease-out forwards;
}

@keyframes elainaAppear {
    from {
        opacity: 0;
        filter: blur(8px);
    }
    to {
        opacity: 1;
        filter: blur(0);
    }
}

/* Elaina melompat kecil hanya saat berbicara */
#character.talking img {
    animation: talkingBounce 0.6s ease-in-out infinite;
}

@keyframes talkingBounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-6px);
    }
}

.dialog-box {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px;
    width: 78%;
    min-height: 120px;
    max-height: 65vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.82);
    color: white;
    border-radius: 15px;
    padding: 15px 20px;
    z-index: 2;
}

#speaker {
    color: gold;
    font-size: 24px;
    margin-bottom: 10px;
}

#dialog {
    font-size: 20px;
    line-height: 1.6;
    white-space: pre-wrap;
}

#choices {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
}

#choices.visible {
    display: flex;
}

.choice-btn {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 8px;
    background: rgba(35,45,75,0.95);
    color: white;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
}

.choice-btn:hover {
    background: rgba(75,95,145,0.98);
    border-color: gold;
}

.hint {
    margin-top: 10px;
    text-align: right;
    color: #ccc;
    font-size: 13px;
}

#fade {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 10;
}

#fade.active {
    opacity: 1;
    pointer-events: all;
}

@media (max-width: 600px) {
    .menu-content h1 {
        font-size: 40px;
    }

    #playerName {
        width: 260px;
    }

    #character {
        left: 10px;
        bottom: 150px;
        height: 65%;
    }

    .dialog-box {
        width: 94%;
        bottom: 12px;
        padding: 12px 15px;
        max-height: 60vh;
    }

    #speaker {
        font-size: 20px;
    }

    #dialog {
        font-size: 16px;
    }

    .choice-btn {
        font-size: 14px;
        padding: 11px;

}
</style>

// ==========================================
// MESIN VISUAL NOVEL
// ==========================================

const startBtn = document.getElementById("startBtn");
const menu = document.getElementById("menu");
const game = document.getElementById("game");
const fade = document.getElementById("fade");
const dialog = document.getElementById("dialog");
const speaker = document.getElementById("speaker");
const character = document.getElementById("character");
const choicesBox = document.getElementById("choices");
const hint = document.getElementById("hint");

let current = 0;
let typing = false;
let typingInterval = null;
let gameStarted = false;
let transitioning = false;
let activeDialogue = null;
let choiceActive = false;

let inBranch = false;
let branchQueue = [];
let branchIndex = 0;

let elainaAppearedThisScene = false;


// Mengganti {player} dengan nama yang dimasukkan pemain.
function replaceName(text) {
    return String(text ?? "").replaceAll("{player}", playerName);
}


// Menghentikan efek bicara Elaina.
function stopTalking() {
    character.classList.remove("talking");
}


// Mengatur kemunculan Elaina.
function showCharacter() {
    if (elainaAppearedThisScene) return;

    elainaAppearedThisScene = true;

    character.classList.remove("appear");
    void character.offsetWidth;
    character.classList.add("appear");
}


// Mengatur dialog dan animasi.
function showDialogue(data) {
    clearInterval(typingInterval);

    if (!data) {
        finishGame();
        return;
    }

    activeDialogue = data;

    speaker.textContent = replaceName(data.speaker);
    dialog.textContent = "";

    dialog.parentElement.scrollTop = 0;

    stopTalking();

    if (data.speaker === "Elaina") {
        showCharacter();
        character.classList.add("talking");
    }

    typing = true;

    const text = replaceName(data.text);
    let i = 0;

    typingInterval = setInterval(() => {
        dialog.textContent += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(typingInterval);
            typing = false;
            stopTalking();
        }
    }, 30);
}


// Menyembunyikan tombol pilihan.
function hideChoices() {
    choicesBox.innerHTML = "";
    choicesBox.classList.remove("visible");
    choiceActive = false;
    hint.style.display = "block";
}


// Menampilkan pilihan bercabang.
function showChoices(data) {
    clearInterval(typingInterval);

    typing = false;
    activeDialogue = null;

    stopTalking();

    speaker.textContent = replaceName(data.speaker);
    dialog.textContent = replaceName(data.text);

    choicesBox.innerHTML = "";
    choicesBox.classList.add("visible");

    choiceActive = true;
    hint.style.display = "none";

    data.choices.forEach((choice) => {
        const button = document.createElement("button");

        button.className = "choice-btn";
        button.textContent = replaceName(choice.text);

        button.addEventListener("click", (event) => {
            event.stopPropagation();

            if (!choiceActive || transitioning) return;

            choiceActive = false;
            inBranch = true;

            branchQueue = choice.dialogue;
            branchIndex = 0;

            hideChoices();

            if (branchQueue.length > 0) {
                showDialogue(branchQueue[branchIndex]);
            } else {
                endBranch();
            }
        });

        choicesBox.appendChild(button);
    });
}


// Mengakhiri cabang dan kembali ke cerita utama.
function endBranch() {
    inBranch = false;
    branchQueue = [];
    branchIndex = 0;

    current++;
    processCurrent();
}


// Mengganti outfit Elaina tanpa mengganggu animasi karakter.
// Gambar baru hanya dipakai jika file-nya benar-benar tersedia.
function changeElainaOutfit(imageName) {
    if (!imageName) return;

    const elainaImage = character.querySelector("img");
    if (!elainaImage) return;

    const testImage = new Image();

    testImage.onload = () => {
        elainaImage.src = imageName;
    };

    testImage.onerror = () => {
        console.warn("File outfit Elaina tidak ditemukan:", imageName);
    };

    testImage.src = imageName;
}


// Mengganti latar dengan transisi fade.
function changeScene(scene) {
    if (transitioning) return;

    transitioning = true;

    clearInterval(typingInterval);

    typing = false;
    activeDialogue = null;

    hideChoices();
    stopTalking();

    fade.classList.add("active");

    setTimeout(() => {
        // Elaina disembunyikan saat pergantian scene.
        character.classList.remove("appear", "talking");
        elainaAppearedThisScene = false;

        game.style.backgroundImage =
            `url("${scene.background}")`;

        // Ganti outfit hanya jika scene memiliki properti outfit.
        if (scene.outfit) {
            changeElainaOutfit(scene.outfit);
        }

        speaker.textContent = "Narator";
        dialog.textContent = replaceName(scene.narration);

        dialog.parentElement.scrollTop = 0;

        fade.classList.remove("active");

        setTimeout(() => {
            transitioning = false;
        }, 1050);

    }, 1000);
}


// Memproses dialog atau scene berikutnya.
function processCurrent() {
    if (current >= story.length) {
        finishGame();
        return;
    }

    const item = story[current];

    if (item.type === "scene") {
        changeScene(item);
        return;
    }

    if (item.type === "choice") {
        showChoices(item);
        return;
    }

    showDialogue(item);
}


// Melanjutkan cerita saat layar diklik.
function advanceStory() {
    if (transitioning || choiceActive) return;

    if (inBranch) {
        branchIndex++;

        if (branchIndex < branchQueue.length) {
            showDialogue(branchQueue[branchIndex]);
        } else {
            endBranch();
        }

        return;
    }

    current++;
    processCurrent();
}


// Mengakhiri cerita.
function finishGame() {
    clearInterval(typingInterval);

    typing = false;
    choiceActive = false;
    activeDialogue = null;

    hideChoices();
    stopTalking();

    speaker.textContent = "Narator";
    dialog.textContent = "=== AKHIR EPISODE 2 ===";

    hint.style.display = "none";
}


// ==========================================
// START GAME
// ==========================================

startBtn.addEventListener("click", () => {
    if (gameStarted) return;

    gameStarted = true;

    playerName =
        document.getElementById("playerName").value.trim();

    if (playerName === "") {
        playerName = "Pemain";
    }

    fade.classList.add("active");

    setTimeout(() => {
        menu.style.display = "none";
        game.style.display = "block";

        current = 0;

        inBranch = false;
        branchQueue = [];
        branchIndex = 0;

        transitioning = false;
        elainaAppearedThisScene = false;

        character.classList.remove("appear", "talking");

        game.style.backgroundImage = "url('taman.jpg')";

        fade.classList.remove("active");

        processCurrent();

    }, 1000);
});


// ==========================================
// KLIK UNTUK MELANJUTKAN DIALOG
// ==========================================

game.addEventListener("click", () => {
    if (transitioning || choiceActive) return;

    // Jika teks sedang diketik, tampilkan seluruh teks.
    if (typing) {
        clearInterval(typingInterval);

        if (activeDialogue) {
            dialog.textContent =
                replaceName(activeDialogue.text);
        }

        typing = false;
        stopTalking();

        return;
    }

    advanceStory();
});
